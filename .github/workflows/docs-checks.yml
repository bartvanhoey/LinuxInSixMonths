name: Docs checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "README.md" "weeks/*.md" "notes/**/*.md"

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --include-fragments --no-progress "README.md" "weeks/*.md" "notes/**/*.md"
          fail: true
